name: beta title

# a beta push must bring a new line in .github/beta-title; that line names the build it starts
run-name: 'title check: ${{ github.event.head_commit.message }}'

on:
  push:
    branches: [ "beta" ]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
        - name: Checkout sources
          uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: Require a new title
          id: title
          env:
            BEFORE: ${{ github.event.before }}
          run: |
            title=$(head -n 1 .github/beta-title | tr -d '\r')
            if [ -z "$title" ]; then
              echo "::error::.github/beta-title is empty; write one line saying what this push carries"
              exit 1
            fi
            # a brand new branch has no before to compare with
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              if git diff --quiet "$BEFORE" HEAD -- .github/beta-title; then
                echo "::error::.github/beta-title did not change in this push; give the build a new title"
                exit 1
              fi
            fi
            echo "title=$title" >> "$GITHUB_OUTPUT"

        - name: Start the named build
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            gh workflow run beta-build.yml --ref beta \
              -f title="${{ steps.title.outputs.title }}" \
              -f sha="${{ github.sha }}"
