name: build

# the run is named after the last commit of the push, so that commit's title says what the push carries
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches: [ "beta" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
        - name: Checkout sources
          uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: Setup Java
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: 21

        - name: Make gradle executable
          run: chmod +x ./gradlew

        - name: Build with Gradle
          run: ./gradlew build -Pbuild_id=${GITHUB_SHA::7}

        # with archive false each jar arrives as its own artifact, named after the file itself
        - name: Upload 26.1.2 jar
          uses: actions/upload-artifact@v7
          with:
            path: |
              versions/26.1.2/build/libs/*.jar
              !versions/26.1.2/build/libs/*-sources.jar
            archive: false

        - name: Upload 26.2 jar
          uses: actions/upload-artifact@v7
          with:
            path: |
              versions/26.2/build/libs/*.jar
              !versions/26.2/build/libs/*-sources.jar
            archive: false
