<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://raw.githubusercontent.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicAddons privacy policy</title>
<style>
	:root { --bg: #ffffff; --text: #1d1d22; --dim: #5d5d68; --line: #d9d9e0; --accent: #2563c9; --tab: #f2f2f6; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #141418; --text: #e6e6ea; --dim: #9a9aa6; --line: #34343e; --accent: #6aa8ff; --tab: #1f1f26; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
	main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
	nav { display: flex; gap: 8px; margin-bottom: 12px; }
	nav button { flex: 1; padding: 10px 12px; font: inherit; color: var(--text); background: var(--tab); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
	nav button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
	h1 { font-size: 1.6em; line-height: 1.25; margin: 0 0 8px; }
	h2 { font-size: 1.2em; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
	ul { padding-left: 22px; }
	li { margin: 4px 0; }
	code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; background: var(--tab); padding: 1px 4px; border-radius: 3px; }
	a { color: var(--accent); overflow-wrap: anywhere; }
	#status, .audit { color: var(--dim); }
	.audit { font-size: 0.92em; margin: 0 0 24px; }
</style>
</head>
<body>
<main>
<nav>
	<button type="button" data-version="main" aria-pressed="true">Main Version</button>
	<button type="button" data-version="beta" aria-pressed="false">Beta Version</button>
</nav>
<p class="audit">Both versions are loaded straight from the MagicAddons GitHub repository, so every change can be checked against its history: <a href="https://github.com/MagicHappened/MagicAddons/commits/master/PRIVACY.md">Main Version history</a> · <a href="https://github.com/MagicHappened/MagicAddons/commits/beta/PRIVACY.md">Beta Version history</a></p>
<p id="status">Loading…</p>
<article id="policy"></article>
</main>
<script>
const sources = {"main":"https://raw.githubusercontent.com/MagicHappened/MagicAddons/master/PRIVACY.md","beta":"https://raw.githubusercontent.com/MagicHappened/MagicAddons/beta/PRIVACY.md"};
const policy = document.getElementById('policy');
const statusLine = document.getElementById('status');
const buttons = document.querySelectorAll('nav button');

function escapedHtml(text) {
	return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inlineHtml(text) {
	return escapedHtml(text)
		.replace(/`([^`]+)`/g, '<code>$1</code>')
		.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
		.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>')
		.replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
}

function policyHtml(markdown) {
	const html = [];
	let paragraph = [];
	let listDepth = 0;
	const closeParagraph = () => {
		if (paragraph.length) html.push('<p>' + inlineHtml(paragraph.join(' ')) + '</p>');
		paragraph = [];
	};
	const closeListsTo = (depth) => {
		while (listDepth > depth) { html.push('</li></ul>'); listDepth--; }
	};
	for (const line of markdown.split(/\r?\n/)) {
		const heading = /^(#{1,3}) (.*)$/.exec(line);
		const item = /^( *)- (.*)$/.exec(line);
		if (heading) {
			closeParagraph(); closeListsTo(0);
			const level = heading[1].length;
			html.push('<h' + level + '>' + inlineHtml(heading[2]) + '</h' + level + '>');
		} else if (item) {
			closeParagraph();
			const depth = Math.floor(item[1].length / 2) + 1;
			if (depth > listDepth) { while (listDepth < depth) { html.push('<ul><li>'); listDepth++; } }
			else { closeListsTo(depth); html.push('</li><li>'); }
			html.push(inlineHtml(item[2]));
		} else if (line.trim() === '') {
			closeParagraph();
		} else if (listDepth > 0 && /^ +/.test(line)) {
			html.push(' ' + inlineHtml(line.trim()));
		} else {
			closeListsTo(0);
			paragraph.push(line.trim());
		}
	}
	closeParagraph(); closeListsTo(0);
	return html.join('');
}

async function showPolicy(version) {
	buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.version === version)));
	statusLine.textContent = 'Loading…';
	policy.innerHTML = '';
	try {
		const response = await fetch(sources[version], { cache: 'no-cache' });
		if (!response.ok) throw new Error(String(response.status));
		policy.innerHTML = policyHtml(await response.text());
		statusLine.textContent = '';
	} catch {
		statusLine.innerHTML = 'Could not load this policy. Read it on GitHub: <a href="' + sources[version] + '">' + sources[version] + '</a>';
	}
	history.replaceState(null, '', '#' + version);
}

buttons.forEach((button) => button.addEventListener('click', () => showPolicy(button.dataset.version)));
showPolicy(location.hash === '#beta' ? 'beta' : 'main');
</script>
</body>
</html>
